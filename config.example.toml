# Floppa VPN Configuration Example
# Copy to /etc/floppa-vpn/config.toml (permissions: 0644)
# Secrets go in secrets.toml (permissions: 0600)

# Top-level keys MUST stay above the first [table]: anything below a table header belongs to
# that table. Parsing is strict — a key the section does not know (a typo, or a top-level key
# that slipped under a table) is rejected at startup, naming the key.

# Minimum client version (optional). Clients with older X-Client-Version get 426 Upgrade Required.
# min_client_version = "0.2.0"

# Allowed CORS origins (optional). Empty/absent = permissive.
# allowed_origins = ["https://vpn.example.com"]

[wireguard]
interface = "wg-floppa"
endpoint = "vpn.example.com:51820"
# listen_port = 51820  # Optional, parsed from endpoint if not set
client_subnet = "10.100.0.0/24"
# server_ip = "10.100.0.1"  # Optional, derived from subnet if not set
dns = ["1.1.1.1", "8.8.8.8"]
allowed_ips = "0.0.0.0/0, ::/0"
# Tunnel MTU (optional). Set on this interface and handed to clients; without it they use
# WireGuard's own 1420. Lower it when the last mile is shorter than 1500 (PPPoE, LTE, another
# tunnel underneath) and large transfers stall while small requests keep working.
# Bounded at startup: 576..=1500, and never below 1280 while allowed_ips carries IPv6.
# mtu = 1380

# Rate limiting (optional, requires daemon to run as root)
[wireguard.rate_limit]
enabled = true
total_bandwidth_mbps = 1000  # Total available bandwidth for all peers

# AmneziaWG configuration (optional)
# AmneziaWG is WireGuard + DPI-resistant obfuscation, on its own interface/port/subnet,
# managed by the same daemon (kernel `amneziawg` module + `awg` tooling). It is the default
# protocol offered to clients. The obfuscation params below are echoed verbatim into each
# client config so both ends agree — they are the single source of truth.
# [amneziawg]
# interface = "awg-floppa"
# endpoint = "vpn.example.com:51821"
# # listen_port = 51821  # Optional, parsed from endpoint if not set
# client_subnet = "10.101.0.0/24"   # MUST differ from the WireGuard subnet
# # server_ip = "10.101.0.1"  # Optional, derived from subnet if not set
# dns = ["1.1.1.1", "8.8.8.8"]
# allowed_ips = "0.0.0.0/0, ::/0"
# mtu = 1280  # Optional, defaults to 1280: below WG's 1420 to absorb obfuscation overhead
#
# [amneziawg.rate_limit]
# enabled = true
# total_bandwidth_mbps = 1000
#
# # Obfuscation params (AmneziaWG 2.0). All optional — defaults to the recommended preset below.
# # H1–H4 (ranges) and S1–S4 must match both ends; Jc/Jmin/Jmax and I1–I5 are initiator-side.
# [amneziawg.obfuscation]
# jc = 6
# jmin = 55
# jmax = 205
# s1 = 72
# s2 = 56
# s3 = 32
# s4 = 16
# h1 = "234567-345678"
# h2 = "3456789-4567890"
# h3 = "56789012-67890123"
# h4 = "456789012-567890123"
# # I1 mimics a QUIC v1 long-header packet; I2–I5 are optional extra signatures.
# i1 = "<b 0xc30000000108><r 8><b 0x08><r 8><b 0x0045dc><t><r 16>"

[bot]
username = "YourBotUsername"  # Bot username for Telegram Login Widget (without @)
# web_app_url = "https://vpn.example.com"  # Public URL for Telegram Mini App button (optional)
# stars_rub_rate = 1.8  # Approximate Stars→RUB rate for /buy display (optional)

[auth]
jwt_expiration_hours = 168  # 1 week (optional, default is 168)
# Rate limits (all optional; defaults shown). Credential logins are capped twice: per login
# name (the brute-force cap on one account) and, more loosely, per client IP.
# register_rate_limit_per_hour = 5           # Registrations per IP per hour
# login_rate_limit_per_15min = 10            # Credential logins per login name per 15 minutes
# login_ip_rate_limit_per_15min = 60         # Credential logins per IP per 15 minutes
# telegram_login_rate_limit_per_15min = 120  # Telegram deep-link starts + code exchanges per IP per 15 minutes

# Client isolation (optional; on by default). floppa-daemon keeps its own nftables table
# (`inet floppa`, needs the `nft` binary) so that a client reaches the public internet and
# nothing else: not other clients, not this host's private addresses, not any private network
# the host routes to. The table stays in place when the daemon stops.
# [isolation]
# enabled = true
# # Private destinations every client may reach anyway, e.g. a resolver you run for clients.
# # Must not overlap a client subnet.
# allow_destinations = ["10.8.0.53/32"]
# # Plans can grant private networks (tables `private_networks` / `plan_private_networks`). Their
# # traffic is marked with this value so a host firewall that drops private destinations can
# # recognise it. Leave unset if the host firewall does not filter private destinations.
# private_access_mark = 0x464c0001

# Metrics / VictoriaMetrics (optional)
# [metrics]
# victoria_metrics_url = "http://127.0.0.1:8428"

# VLESS+REALITY proxy configuration (optional)
# Only needed if the VLESS proxy is deployed. Used by floppa-server to generate vless:// URIs.
# [vless]
# endpoint = "vpn.example.com:443"       # VLESS+REALITY server address (HAProxy in front of floppa-vless)
# sni = "www.microsoft.com"              # REALITY SNI for camouflage
# short_id = "abcdef1234567890"           # REALITY short ID (hex)
# flow = "xtls-rprx-vision"              # Flow control (default: xtls-rprx-vision)
