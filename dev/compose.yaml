services:
  db:
    image: docker.io/library/postgres:17
    # Linux development: no bridge, firewall rules or TUN devices. PostgreSQL binds loopback.
    network_mode: host
    command: ['postgres', '-p', '${FLOPPA_DEV_DB_PORT:-54329}', '-c', 'listen_addresses=127.0.0.1']
    environment:
      POSTGRES_USER: floppa_dev
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: floppa_dev
      PGPORT: ${FLOPPA_DEV_DB_PORT:-54329}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U floppa_dev -d floppa_dev']
      interval: 1s
      timeout: 5s
      retries: 30
volumes:
  database:
