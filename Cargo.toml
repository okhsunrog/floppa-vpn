[workspace]
resolver = "2"
members = [
    "floppa-core",
    "floppa-daemon",
    "floppa-server",
    "floppa-vless",
    "floppa-cli",
    "floppa-tunnel-config",
    "floppa-api-client",
    "xtask",
]
exclude = [
    "floppa-client/src-tauri",
    "tauri-plugin-vpn",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.23"
rand = "0.10"

# Auth (JWT + Telegram verification)
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Telegram bot
teloxide = { version = "0.17", features = ["macros"] }

# Database (PostgreSQL)
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }

# Config
toml = "0.9"

# Web server
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# OpenAPI (schemas live in floppa-core, the document in floppa-server)
utoipa = "5.5.0"

# Metrics / observability
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", features = ["http-listener"] }

# WireGuard/AmneziaWG engine (fork of Mullvad's boringtun). floppa-client/src-tauri is outside the
# workspace and pins the same tag by hand; bump both together.
gotatun = { git = "https://github.com/okhsunrog/gotatun", tag = "amnezia-2026-08-25", features = ["device", "tun"] }

# Shared crates
floppa-core = { path = "floppa-core" }
floppa-tunnel-config = { path = "floppa-tunnel-config" }
