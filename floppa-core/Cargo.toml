[package]
name = "floppa-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true
base64.workspace = true
hex.workspace = true
rand.workspace = true
toml.workspace = true
# Held at 0.10 deliberately. 0.11 moves to rand_core 0.9, and argon2 — which hashes admin
# passwords two files over — has no stable release on it yet (0.6 is release candidates only).
# Taking 0.11 alone means either depending on an RC for password hashing or pinning a second
# rand_core by hand to restore a feature the old chacha used to enable. Revisit when argon2 0.6
# ships; `ciphertext_written_by_an_older_build_still_decrypts` is there to prove the upgrade
# leaves data already in the database readable.
chacha20poly1305 = "0.10.1"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
ipnetwork = { version = "0.21.1", features = ["serde"] }
veil = "0.3.0"
uuid = { version = "1.22.0", features = ["serde", "v4"] }
argon2 = { version = "0.5.3", features = ["std"] }
url = { version = "2.5.8", features = ["serde"] }
utoipa.workspace = true

[dev-dependencies]
sqlx = { workspace = true, features = ["migrate"] }
