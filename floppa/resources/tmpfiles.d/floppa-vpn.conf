# Allow clients outside the service group to distinguish a missing socket from
# a socket they may not use. Blocking directory traversal makes a disabled
# service look like a running but forbidden one and prevents in-process mode.
# The directory remains root-owned and not writable by clients; access to the
# service itself is restricted by SocketMode=0660 and SocketGroup=floppa.
d /run/floppa-vpn 0711 root floppa -
