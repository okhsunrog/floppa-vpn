# The directory the socket lives in.
#
# Belt to the socket's own braces. `ListenStream=` creates what it needs, but it creates it with
# defaults, and a directory anyone may enter puts the whole weight on the socket's mode being right
# — applied to a file that, for an instant, already exists. `0750 root:floppa` means a user outside
# the group cannot reach the path at all, whatever the socket inside it says.
d /run/floppa-vpn 0750 root floppa -
