# The group that may drive this machine's VPN.
#
# A group and no user: the service runs as root, because it configures routing and DNS. What this
# names is the other side — who is allowed to talk to it. Empty on install, on purpose: being in it
# is equivalent to being root as far as this machine's network is concerned, so putting somebody
# there is an administrator's decision and not a package's.
g floppa -
