[package]
name = "floppa-cli"
version = "0.1.0"
edition = "2024"
description = "CLI client for Floppa VPN"

[dependencies]
gotatun = { git = "https://github.com/okhsunrog/gotatun", tag = "amnezia-2026-08-25", features = ["device", "tun"] }
tun = { version = "0.8", features = ["async"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
ipnetwork = "0.21"
anyhow = "1"
dirs = "6"
open = "5"
shoes-lite = { git = "https://github.com/okhsunrog/shoes-lite", tag = "v0.1.0" }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2.4"
uuid = { version = "1.25.0", features = ["v4"] }
url = "2.5.8"
thiserror.workspace = true
# Uncomment for local development, comment out before commit/push:
# shoes-lite = { path = "../../rust/shoes-lite" }
