[package]
name = "floppa-client"
version = "0.5.1"
description = "Floppa VPN Client"
authors = ["you"]
edition = "2024"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "floppa_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["config-json5"] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["config-json5", "specta", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = { version = "2", features = ["colored"] }
tauri-plugin-os = "2"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = { version = "0.0.12" }
tauri-specta = { git = "https://github.com/specta-rs/tauri-specta", rev = "40a7b831b0493ac2be7bc7bfd55980d5a6802044", features = ["typescript", "derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
async-trait = "0.1"
ipnetwork = { version = "0.21", features = ["serde"] }

# gotatun - WireGuard implementation (fork of Mullvad's boringtun)
gotatun = { git = "https://github.com/okhsunrog/gotatun", tag = "amnezia-2026-08-25", features = ["device", "tun"] }
# Uncomment for local development, comment out before commit/push:
# gotatun = { path = "../../../rust/gotatun/gotatun", features = ["device", "tun"] }
tun = { version = "0.8", features = ["async"] }

# VPN plugin for mobile platforms
tauri-plugin-vpn = { path = "../../tauri-plugin-vpn" }
# Config parsing, AmneziaWG parameters and route helpers shared with floppa-cli
floppa-tunnel-config = { path = "../../floppa-tunnel-config", features = ["gotatun"] }
tauri-plugin-deep-link = "2"
hostname = "0.4.2"
tauri-plugin-opener = "2.5.3"
tempfile = "3.26.0"
tauri-plugin-android-fs = "29"
# VLESS+REALITY protocol support
shoes-lite = { git = "https://github.com/okhsunrog/shoes-lite", tag = "v0.1.0" }
flate2 = "1.1.9"
tar = "0.4.44"
tokio-util = { version = "0.7.18", features = ["rt"] }
# Uncomment for local development, comment out before commit/push:
# shoes-lite = { path = "../../../rust/shoes-lite" }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["linux-native-async-persistent"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
# 0.7.40 carries the "hide the console window" change this used to be forked for; upstream took
# it in as "refactor run_command function", so the [patch.crates-io] override is gone.
wintun-bindings = "0.7.40"

[target.'cfg(target_os = "android")'.dependencies]
futures = "0.3.32"
jni = "0.22.3"
tarpc = { version = "0.38.0", features = ["serde-transport", "tokio1", "unix"] }
tokio-serde = { version = "0.9.0", features = ["bincode"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
tracing-logcat = "0.1.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3.6.3", features = ["crypto-rust"] }
uuid = { version = "1.25.0", features = ["v4"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
# Held at 1.x on purpose: this is here so the rpc tests round-trip through the encoder that is
# actually on the wire, and `tokio-serde` 0.9 depends on bincode 1.3. Moving it to 3.x would make
# the test exercise a format production never sees. Track tokio-serde, not the registry.
bincode = "1.3"
specta-serde = "0.0.12"
tokio = { version = "1", features = ["test-util"] }
