# Its own workspace root, deliberately. The root manifest already lists this path in
# `workspace.exclude`, but that only holds for *this* checkout: the Arch package extracts the
# release tarball into `scripts/arch/src/`, inside the repository, and the copy that lands there
# is not on any exclude list — cargo then finds the outer workspace and refuses to build with
# "current package believes it's in a workspace when it's not". An empty table makes the crate
# standalone wherever it is unpacked.
[workspace]

[package]
name = "floppa-client"
version = "0.6.1"
description = "Floppa VPN Client"
authors = ["you"]
edition = "2024"
license = "GPL-3.0-or-later"
# There is one binary and this names it, so a second one can never quietly become the default
# again. `examples/export_bindings.rs` is an example rather than a `[[bin]]` for the same reason
# from the other side: the bundler packages every binary a crate declares, and 0.6.0 shipped the
# bindings generator instead of the app while 0.6.1's first build shipped both.
default-run = "floppa-client"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "floppa_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["config-json5"] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["config-json5", "specta", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = { version = "0.0.12" }
tauri-specta = { git = "https://github.com/specta-rs/tauri-specta", rev = "40a7b831b0493ac2be7bc7bfd55980d5a6802044", features = ["typescript", "derive"] }
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
async-trait = "0.1"

# VPN plugin for mobile platforms
tauri-plugin-vpn = { path = "../../tauri-plugin-vpn" }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2.5.3"
tempfile = "3.26.0"
tauri-plugin-android-fs = "29"
# VLESS+REALITY protocol support
shoes-lite = { git = "https://github.com/okhsunrog/shoes-lite", tag = "v0.1.0" }
floppa-api-client = { version = "0.1.0", path = "../../floppa-api-client" }
floppa-vpn-core = { version = "0.1.0", path = "../../floppa-vpn-core" }
# The bridge an MCP server drives this app through, so an agent can read the DOM and click
# things instead of aiming at pixels. Optional and off by default: a release build must not carry
# a websocket server, and this one listens for commands. Turn it on with
# `--features mcp-bridge`, which `just dev-mcp` does.
tauri-plugin-mcp-bridge = { version = "0.13.0", optional = true }
# Uncomment for local development, comment out before commit/push:
# shoes-lite = { path = "../../../rust/shoes-lite" }

# The keyring, the tunnels, the socket and the platform layer are all `floppa-vpn-core`'s
# dependencies now; what is left here is the JNI bridge Kotlin calls and the desktop app shell.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
specta-serde = "0.0.12"
tokio = { version = "1", features = ["test-util"] }

# Tauri from our fork, pinned to one commit, until 2.12 is published.
#
# What we are here for is tao 0.36 and tauri-apps/tao#1218 in it: before that fix, a window shown
# after being hidden came back with a stale input region on Wayland — deaf to the pointer, in the
# decoration and on the page alike, while keyboard focus kept working. The close button, and every
# button in the app, stopped responding after the first trip to the tray. Nothing released carries
# the fix: 2.11.5 is the newest on crates.io and it pins tao 0.35.
#
# The pin is also what carries tauri-apps/tauri#15949, merged into `dev` as cb2ecac5: on Android
# the plugin manager crashed the app whenever an activity was destroyed while another was running,
# which is what installing an APK over the running app does (#15948). It rode a fork until it
# landed upstream.
#
# A `rev`, not a branch: the lock file would hold the commit either way, but a branch invites a
# `cargo update` to move it, and this is not a dependency to drift on. The dev branch still calls
# itself 2.11.5, which is why the plugins from crates.io are satisfied by the patch.
#
# Drop this whole block when Tauri 2.12 is out — nothing else in the tree depends on it.
[patch.crates-io]
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "cb2ecac53a505b974ef24f0d4f66ac04fc298eff" }
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "cb2ecac53a505b974ef24f0d4f66ac04fc298eff" }
tauri-runtime = { git = "https://github.com/tauri-apps/tauri", rev = "cb2ecac53a505b974ef24f0d4f66ac04fc298eff" }
tauri-runtime-wry = { git = "https://github.com/tauri-apps/tauri", rev = "cb2ecac53a505b974ef24f0d4f66ac04fc298eff" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri", rev = "cb2ecac53a505b974ef24f0d4f66ac04fc298eff" }
tauri-macros = { git = "https://github.com/tauri-apps/tauri", rev = "cb2ecac53a505b974ef24f0d4f66ac04fc298eff" }
tauri-codegen = { git = "https://github.com/tauri-apps/tauri", rev = "cb2ecac53a505b974ef24f0d4f66ac04fc298eff" }
tauri-plugin = { git = "https://github.com/tauri-apps/tauri", rev = "cb2ecac53a505b974ef24f0d4f66ac04fc298eff" }

[features]
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]
