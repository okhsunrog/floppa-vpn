# Its own workspace root, deliberately. The root manifest already lists this path in
# `workspace.exclude`, but that only holds for *this* checkout: the Arch package extracts the
# release tarball into `scripts/arch/src/`, inside the repository, and the copy that lands there
# is not on any exclude list — cargo then finds the outer workspace and refuses to build with
# "current package believes it's in a workspace when it's not". An empty table makes the crate
# standalone wherever it is unpacked.
[workspace]

[package]
name = "floppa-client"
version = "0.6.7"
description = "Floppa VPN Client"
authors = ["you"]
edition = "2024"
license = "GPL-3.0-or-later"
# There is one binary and this names it, so a second one can never quietly become the default
# again. `examples/export_bindings.rs` is an example rather than a `[[bin]]` for the same reason
# from the other side: the bundler packages every binary a crate declares, and 0.6.0 shipped the
# bindings generator instead of the app while 0.6.1's first build shipped both.
default-run = "floppa-client"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "floppa_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["config-json5"] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12.4", features = ["config-json5", "specta", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = { version = "0.0.12" }
tauri-specta = { git = "https://github.com/specta-rs/tauri-specta", rev = "40a7b831b0493ac2be7bc7bfd55980d5a6802044", features = ["typescript", "derive"] }
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
async-trait = "0.1"

# VPN plugin for mobile platforms
tauri-plugin-vpn = { path = "../../tauri-plugin-vpn" }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2.5.3"
tauri-plugin-android-fs = "29"
# VLESS+REALITY protocol support
shoes-lite = { git = "https://github.com/okhsunrog/shoes-lite", rev = "2451f6db13c2d503b87ba8366a6da118da4447e0", version = "0.1.0" }
floppa-api-client = { version = "0.1.0", path = "../../floppa-api-client" }
floppa-vpn-core = { version = "0.1.0", path = "../../floppa-vpn-core" }
# The bridge an MCP server drives this app through, so an agent can read the DOM and click
# things instead of aiming at pixels. Optional and off by default: a release build must not carry
# a websocket server, and this one listens for commands. Turn it on with
# `--features mcp-bridge`, which `just dev-mcp` does.
tauri-plugin-mcp-bridge = { version = "0.13.0", optional = true }
floppa-provision = { version = "0.1.0", path = "../../floppa-provision" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
floppa-net = { version = "0.1.0", path = "../../floppa-net" }
# Uncomment for local development, comment out before commit/push:
# shoes-lite = { path = "../../../rust/shoes-lite" }

# The keyring, the tunnels, the socket and the platform layer are all `floppa-vpn-core`'s
# dependencies now; what is left here is the JNI bridge Kotlin calls and the desktop app shell.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
specta-serde = "0.0.12"
tokio = { version = "1", features = ["test-util"] }

[patch.crates-io]
h3 = { git = "https://github.com/okhsunrog/foldfin", rev = "e09b3d2819463a0845995855bbe61591b79cd7a5" }
h3-datagram = { git = "https://github.com/okhsunrog/foldfin", rev = "e09b3d2819463a0845995855bbe61591b79cd7a5" }
h3-quinn = { git = "https://github.com/okhsunrog/foldfin", rev = "e09b3d2819463a0845995855bbe61591b79cd7a5" }

[features]
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]
